<!doctype html>
<html>
<head><meta charset="utf-8" /><title>Verify Email</title></head>
<body>
  <h1>Email verification</h1>
  <pre id="status">Verifying...</pre>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const status = document.getElementById('status');
    fetch('/api/auth/verify-email/' + encodeURIComponent(token || ''))
      .then(async (r) => {
        const text = await r.text();
        const data = (() => { try { return JSON.parse(text); } catch { return text; } })();
        if (!r.ok) throw new Error(JSON.stringify(data));
        status.textContent = 'Email verified. You can return to the portal.';
      })
      .catch((err) => { status.textContent = err.message; });
  </script>
</body>
</html>
